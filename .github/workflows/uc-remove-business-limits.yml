name: UC Remove Business Limits

on:
  push:
    branches:
      - codex/user-control-correction
    paths:
      - .github/workflows/uc-remove-business-limits.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/user-control-correction
          fetch-depth: 0
      - name: Remove residual planning-size gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'target not found in {path}: {old[:80]}')
              text = text.replace(old, new, -1 if count is None else count)
              p.write_text(text)

          # AI read context must include excluded candidates; preference remains a hint,
          # not a visibility/permission filter.
          p = Path('apps/server/planning-context-v3.ts')
          text = p.read_text()
          text = text.replace('''import {\n  activeCoreVisits,\n  activePlanningAreas,\n  effectivePlanningRole,\n} from "./planning-roles-v3.js";''', 'import { effectivePlanningRole } from "./planning-roles-v3.js";')
          old = '''export function buildBackboneContextV3(plan: TravelPlanDocument) {\n  return {\n    tripFacts: plan.trip,\n    planningAreas: activePlanningAreas(plan.candidates, plan.places).map((candidate) => candidateSummary(plan, candidate)).filter(Boolean),\n    coreVisits: activeCoreVisits(plan.candidates, plan.places).map((candidate) => candidateSummary(plan, candidate)).filter(Boolean),\n  };\n}'''
          new = '''export function buildBackboneContextV3(plan: TravelPlanDocument) {\n  const places = new Map(plan.places.map((place) => [place.id, place]));\n  const byRole = (role: "planning_area" | "core_visit") => plan.candidates.filter((candidate) => {\n    const place = places.get(candidate.placeId);\n    return Boolean(place && effectivePlanningRole(candidate, place) === role);\n  });\n  return {\n    tripFacts: plan.trip,\n    planningAreas: byRole("planning_area").map((candidate) => candidateSummary(plan, candidate)).filter(Boolean),\n    coreVisits: byRole("core_visit").map((candidate) => candidateSummary(plan, candidate)).filter(Boolean),\n  };\n}'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const byRole = (role: "planning_area" | "core_visit")' not in text:
              raise SystemExit('planning context target not found')
          p.write_text(text)

          # Canonical / proposal metadata: remove old trip-size business caps.
          replace('apps/server/contracts-v2.ts', 'candidateIds: z.array(IdSchema).min(1).max(1800)', 'candidateIds: z.array(IdSchema).min(1)')
          replace('apps/server/contracts-v2.ts', 'affectedCandidateIds: z.array(IdSchema).max(1800)', 'affectedCandidateIds: z.array(IdSchema)')
          replace('apps/server/contracts-v2.ts', 'affectedPlaceIds: z.array(IdSchema).max(1800)', 'affectedPlaceIds: z.array(IdSchema)')
          replace('apps/server/contracts-v2.ts', 'unscheduledCandidates: z.array(z.object({ candidateId: IdSchema, reason: TextSchema.max(1000) }).strict()).max(1800)', 'unscheduledCandidates: z.array(z.object({ candidateId: IdSchema, reason: TextSchema.max(1000) }).strict())')

          replace('apps/server/skeleton-contracts-v3.ts', 'omittedPlanningAreas: z.array(OmittedPlanningAreaSchema).max(1800)', 'omittedPlanningAreas: z.array(OmittedPlanningAreaSchema)')

          # Conversation/action input: duration/day count and positional indexes are user data,
          # not operation resource guards.
          replace('apps/server/ai-stage-contracts-v3.ts', 'requestedDurationDays: z.number().int().min(1).max(365).nullable()', 'requestedDurationDays: z.number().int().min(1).nullable()')
          replace('apps/server/ai-stage-contracts-v3.ts', 'dayIds: z.array(z.string().trim().min(1).max(160)).max(90)', 'dayIds: z.array(z.string().trim().min(1).max(160))')
          replace('apps/server/ai-stage-contracts-v3.ts', 'targetIndex: z.number().int().min(0).max(100).nullable()', 'targetIndex: z.number().int().min(0).nullable()')
          replace('apps/server/ai-stage-contracts-v3.ts', 'index: z.number().int().min(0).max(100).nullable()', 'index: z.number().int().min(0).nullable()')

          replace('apps/server/ai-action-input-contracts-v3.ts', 'requestedDurationDays: z.number().int().min(1).max(365).nullable()', 'requestedDurationDays: z.number().int().min(1).nullable()')
          replace('apps/server/ai-action-input-contracts-v3.ts', 'const DetailUpdate = z.object({ dayIds: z.array(Id).max(90).optional()', 'const DetailUpdate = z.object({ dayIds: z.array(Id).optional()')
          replace('apps/server/ai-action-input-contracts-v3.ts', 'index: z.number().int().min(0).max(100).nullable().optional()', 'index: z.number().int().min(0).nullable().optional()')
          replace('apps/server/ai-action-input-contracts-v3.ts', 'targetIndex: z.number().int().min(0).max(100)', 'targetIndex: z.number().int().min(0)')

          # AI output contracts: remove the old 80/90/1800 planning-size assumptions.
          replace('apps/server/ai-action-contracts-v3.ts', 'omittedPlanningAreas: z.array(OmittedPlanningAreaSchema).max(1800)', 'omittedPlanningAreas: z.array(OmittedPlanningAreaSchema)')
          replace('apps/server/ai-action-contracts-v3.ts', 'stops: z.array(DetailedStopDraftSchema).max(80)', 'stops: z.array(DetailedStopDraftSchema)')
          replace('apps/server/ai-action-contracts-v3.ts', 'dayUpdates: z.array(DetailedDayUpdateSchema).min(1).max(90)', 'dayUpdates: z.array(DetailedDayUpdateSchema).min(1)')
          replace('apps/server/ai-action-contracts-v3.ts', 'unscheduledCandidates: z.array(DetailedUnscheduledCandidateSchema).max(1800)', 'unscheduledCandidates: z.array(DetailedUnscheduledCandidateSchema)')
          replace('apps/server/ai-action-contracts-v3.ts', 'affectedDayIds: z.array(IdSchema).min(1).max(90)', 'affectedDayIds: z.array(IdSchema).min(1)')
          replace('apps/server/ai-action-contracts-v3.ts', 'orderedStopIds: z.array(IdSchema).max(80)', 'orderedStopIds: z.array(IdSchema)')
          replace('apps/server/ai-action-contracts-v3.ts', 'stops: z.array(ItineraryRefineStopSchema).max(80)', 'stops: z.array(ItineraryRefineStopSchema)')

          workflow = Path('.github/workflows/uc-remove-business-limits.yml')
          workflow.unlink()
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add apps/server/planning-context-v3.ts apps/server/contracts-v2.ts apps/server/skeleton-contracts-v3.ts apps/server/ai-stage-contracts-v3.ts apps/server/ai-action-input-contracts-v3.ts apps/server/ai-action-contracts-v3.ts .github/workflows/uc-remove-business-limits.yml
          git commit -m "UC7: remove residual planning-size business limits"
          git push origin codex/user-control-correction
