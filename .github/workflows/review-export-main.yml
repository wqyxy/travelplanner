name: Temporary review export

on:
  push:
    branches:
      - codex/v3-runtime-ui-completion
    paths:
      - .github/workflows/review-export-main.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Package source and dependencies
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=dist --exclude=private_data -czf /tmp/travelplanner-main-review.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: travelplanner-main-review
          path: /tmp/travelplanner-main-review.tar.gz
          compression-level: 0
          retention-days: 1
