name: UC Duration Expression Cleanup

on:
  push:
    paths:
      - '.github/workflows/uc-clean-duration-expression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/user-control-correction
      - name: Clean expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/CandidateWorkflowPanelV3.tsx')
          text = path.read_text()
          old = '(!Number.isInteger(parsed) || parsed < 0 || false)'
          if old not in text:
              raise SystemExit('expected duration expression not found')
          path.write_text(text.replace(old, '(!Number.isInteger(parsed) || parsed < 0)', 1))
          PY
          git diff --check
      - name: Commit and self-remove
        run: |
          rm .github/workflows/uc-clean-duration-expression.yml
          git config user.name "wqyxy"
          git config user.email "wqyxy@hotmail.com"
          git add apps/web/src/CandidateWorkflowPanelV3.tsx .github/workflows/uc-clean-duration-expression.yml
          git commit -m "UC: clean duration validation expression"
          git push origin HEAD:codex/user-control-correction
