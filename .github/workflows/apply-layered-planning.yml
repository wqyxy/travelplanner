name: Apply layered Macro Micro planning

on:
  push:
    branches:
      - impl/right-control-workflow

permissions:
  contents: write

concurrency:
  group: layered-macro-micro-planning
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply layered planning transformations
        run: |
          python .github/prepare-layered-script.py
          python .github/apply-layered-planning.py
      - name: Remove one-shot implementation helpers
        run: rm -f .github/prepare-layered-script.py .github/apply-layered-planning.py .github/workflows/apply-layered-planning.yml
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add layered macro micro discovery and coverage'
          git push origin HEAD:impl/right-control-workflow
