name: UC User Control Finalizer

on:
  push:
    branches:
      - codex/user-control-correction
    paths:
      - .github/workflows/uc-user-control-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/user-control-correction
          fetch-depth: 0
      - name: Apply idempotent final patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1. Manual PlaceKind must be preserved exactly.
          app = Path('apps/web/src/AppWorkflowV3.tsx')
          text = app.read_text()
          old = 'kind: draft.planningRole === "planning_area" ? "city" : "attraction"'
          if old in text:
              text = text.replace(old, 'kind: draft.placeKind', 1)
          if 'kind: draft.placeKind' not in text:
              raise SystemExit('AppWorkflow placeKind wiring missing')
          app.write_text(text)

          # 2. Multi-day local actions must never silently escalate to Trip Scope.
          runtime = Path('apps/server/planner-runtime-v3.ts')
          text = runtime.read_text()
          start = text.index('function actionScope(')
          end = text.index('\nfunction proposalDiff', start)
          action_scope = '''function dayMutationScope(dayIds: string[]): ProposalScope {
            const ids = [...new Set(dayIds.filter(Boolean))];
            if (!ids.length) throw new Error("局部行程 Action 缺少目标 Day，不能自动扩大为整趟 Scope。");
            return ids.length === 1 ? { type: "day", id: ids[0] } : { type: "days", ids };
          }

          function actionScope(actionType: AiActionType, targetIds: string[], parameters: Record<string, unknown>): ProposalScope {
            if (actionType.startsWith("requirements.")) return { type: "trip", id: null };
            if (actionType.startsWith("destination.") || actionType.startsWith("interest.")) return { type: "candidate_pool", id: null };
            if (actionType === "itinerary.day.optimize") {
              const parameterIds = Array.isArray(parameters.dayIds) ? parameters.dayIds.filter((value): value is string => typeof value === "string") : [];
              const id = targetIds[0] || (typeof parameters.dayId === "string" ? parameters.dayId : parameterIds.length === 1 ? parameterIds[0] : "");
              if (!id) throw new Error("单日优化缺少目标 Day，不能自动扩大为整趟 Scope。");
              return { type: "day", id };
            }
            if (actionType === "itinerary.refine" || actionType === "itinerary.detail.update") {
              const parameterIds = Array.isArray(parameters.dayIds) ? parameters.dayIds.filter((value): value is string => typeof value === "string") : [];
              return dayMutationScope([...targetIds, ...parameterIds, ...(typeof parameters.dayId === "string" ? [parameters.dayId] : [])]);
            }
            return { type: "trip", id: null };
          }
          '''
          text = text[:start] + action_scope + text[end:]

          # Narrow multi-day persistence assignments. The substitutions are intentionally
          # limited to const-scope ternaries ending in the old Trip fallback.
          pat = re.compile(
              r'const scope(?:: ProposalScope)? = (?P<ids>[A-Za-z0-9_.]+)\.length === 1\s*'
              r'\?\s*\{ type: "day"(?: as const)?, id: (?P=ids)\[0\] \}\s*'
              r':\s*\{ type: "trip"(?: as const)?, id: null \};'
          )
          text = pat.sub(lambda m: f'const scope = dayMutationScope({m.group("ids")});', text)
          variants = {
              'const scope = result.affectedDayIds.length === 1 ? { type: "day" as const, id: result.affectedDayIds[0] } : { type: "trip" as const, id: null };': 'const scope = dayMutationScope(result.affectedDayIds);',
              'const scope = result.dayIds.length === 1 ? { type: "day" as const, id: result.dayIds[0] } : { type: "trip" as const, id: null };': 'const scope = dayMutationScope(result.dayIds);',
              'const scope = affectedDayIds.length === 1 ? { type: "day" as const, id: affectedDayIds[0] } : { type: "trip" as const, id: null };': 'const scope = dayMutationScope(affectedDayIds);',
              'const scope = dayIds.length === 1 ? { type: "day" as const, id: dayIds[0] } : { type: "trip" as const, id: null };': 'const scope = dayMutationScope(dayIds);',
          }
          for old_value, new_value in variants.items():
              text = text.replace(old_value, new_value)
          if 'return ids.length === 1 ? { type: "day", id: ids[0] } : { type: "days", ids };' not in text:
              raise SystemExit('days scope helper missing')
          runtime.write_text(text)

          # 3. Root agent instructions: new principle overrides old planning-quality rules.
          agents = Path('AGENTS.md')
          text = agents.read_text()
          marker = '## User Control Correction（最高优先级产品约束）'
          if marker not in text:
              addition = '''\n\n## User Control Correction（最高优先级产品约束）\n\n当前 canonical 只保证数据结构、引用、安全、CAS、Scope 与 Provider 事实边界，不保证旅行方案“合理”。\n\n- 用户是旅行方案的唯一决策者；canonical 中的内容均视为用户已接受，不按 source 区分权限。\n- PlanningRole 与 PlaceKind 独立；`planning_area` 不再要求 `kind=city`。旧数据缺 planningRole 时才使用 city→planning_area、其他→detail_interest 的兼容推断。\n- 未定位、semantic duplicate、excluded 已排入、must-go 未覆盖、父 Planning Area 缺失、天数不一致、时间不完整/重叠/跨夜/duration mismatch 都属于 Planning Advisory，不得作为 canonical 写入 blocker。\n- 同一 canonical Place ID 仍只能有一个 Candidate；未知引用、重复 ID、self/cycle、无效 enum/shape 仍硬失败。\n- AI 默认只修改用户本轮明确目标；读取上下文可以更宽。多日局部修改使用 `days` Scope，只有显式整趟 Action 才能获得 Trip Scope。\n- 不得为了“更合理”静默删除、移动、缩短、改期或替换用户内容。\n- `docs/USER_CONTROL_CORRECTION.md` 与 `docs/USER_CONTROL_CORRECTION_PROGRESS.md` 是本专项实施依据；与旧 city-only / planning blocker 文档冲突时，以本节和这两份文档为准。\n'''
              text += addition
          agents.write_text(text)

          # 4. README: add product-level override without deleting historical notes.
          readme = Path('README.md')
          text = readme.read_text()
          marker = '## User Control Correction（2026-09-04）'
          if marker not in text:
              addition = '''\n\n## User Control Correction（2026-09-04）\n\n当前产品原则已调整为“用户为主、AI 为辅”：canonical 保存用户当前接受的旅行方案；旅行合理性问题改由 Advisory + AI Proposal 处理，不再由代码硬拦。PlanningRole 与 PlaceKind 独立，未定位地点也可以进入行程；五步导航始终可进入。AI 的修改继续受到 Proposal、Scope、generation CAS 和 Provider 事实边界约束。详见 `docs/USER_CONTROL_CORRECTION.md`。\n'''
              text += addition
          readme.write_text(text)

          # 5. Old five-step plan remains useful history, but its old blockers are superseded.
          plan_doc = Path('docs/TravelPlanner 五步规划流程重构实施方案.md')
          if plan_doc.exists():
              text = plan_doc.read_text()
              marker = '> **2026-09-04 User Control Correction 覆盖说明**'
              if marker not in text:
                  text = marker + '\n> 本文件保留五步重构的历史设计与实施依据；其中 `planning_area 必须 kind=city`、未定位/必去/天数/时间等作为硬阻塞的旧规则，已由 `docs/USER_CONTROL_CORRECTION.md` 覆盖。当前最终综合 Gate 暂缓，待 User Control Correction 完成后重新定义。\n\n' + text
              plan_doc.write_text(text)
          PY
          git diff --check
      - name: Commit and clean one-shot workflows
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git rm -f .github/workflows/uc-finalize-runtime-scope.yml .github/workflows/uc-user-control-finalizer.yml || true
          git add apps/server/planner-runtime-v3.ts apps/web/src/AppWorkflowV3.tsx AGENTS.md README.md "docs/TravelPlanner 五步规划流程重构实施方案.md" .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "UC7: finalize user-control scope and documentation"
          git pull --rebase origin codex/user-control-correction
          git push origin codex/user-control-correction
