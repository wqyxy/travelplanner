name: UC Duration Cap Targeted Patch

on:
  push:
    paths:
      - '.github/workflows/uc-duration-cap-targeted.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/user-control-correction
          fetch-depth: 0
      - name: Patch known suggested-duration fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'apps/server/contracts-v2.ts',
              'apps/server/backbone-contracts-v3.ts',
              'apps/server/ai-action-contracts-v3.ts',
              'apps/server/ai-led-micro-contract-v2.ts',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace('z.number().int().min(0).max(10080)', 'z.number().int().min(0)')
              path.write_text(text)
          path = Path('apps/web/src/CandidateWorkflowPanelV3.tsx')
          text = path.read_text()
          text = text.replace('parsed > 10080', 'false')
          text = text.replace(' min="0" max="10080" value={duration}', ' min="0" value={duration}')
          path.write_text(text)
          PY
          git diff --check
      - name: Commit and self-remove
        run: |
          rm .github/workflows/uc-duration-cap-targeted.yml
          git config user.name "wqyxy"
          git config user.email "wqyxy@hotmail.com"
          git add apps/server/contracts-v2.ts apps/server/backbone-contracts-v3.ts apps/server/ai-action-contracts-v3.ts apps/server/ai-led-micro-contract-v2.ts apps/web/src/CandidateWorkflowPanelV3.tsx .github/workflows/uc-duration-cap-targeted.yml
          git commit -m "UC: remove suggested duration business cap"
          git push origin HEAD:codex/user-control-correction
