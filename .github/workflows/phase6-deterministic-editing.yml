          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('docs/IMPLEMENTATION_STATUS.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'## Current Phase\n\n.*?(?=\n## )', '## Current Phase\n\nPhase 7 — AI scoped Proposal preview, apply, reject and undo.\n', text, count=1, flags=re.S)
          section = '''
          ### Phase 6 — Deterministic Itinerary Editing

          - Added HTML drag-and-drop for same-Day reorder and cross-Day movement.
          - Added keyboard-accessible up/down/previous-Day/next-Day controls, Day reorder, Stop add/remove and independent start/end Anchor selection.
          - Every edit sends one fixed PlanCommand with expectedGeneration CAS; no edit path invokes AI.
          - Route inputs become dirty after editing and remain dirty until the user explicitly requests recalculation.
          - Added pure tests for command construction and move-index boundaries.
          '''
          if '### Phase 6 — Deterministic Itinerary Editing' not in text:
              text = text.replace('\n## Important Decisions', '\n' + section.strip() + '\n\n## Important Decisions')
          text = re.sub(r'## Next Phase\n\n.*?(?=\n## )', '''## Next Phase

          Phase 7:

          - Connect Candidate/Place/Day/Trip AI scopes to stored AiProposal records.
          - Render structured Preview/Diff before any canonical write.
          - Implement Apply/Reject and Revision-backed Undo with generation conflict handling.
          - Ensure Proposal UI never bypasses the proposal state machine through the normal command endpoint.
          ''', text, count=1, flags=re.S)
          path.write_text(text, encoding='utf-8')
          PY

