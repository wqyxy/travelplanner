          cat > apps/web/src/v3-editor.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { buildAddStopCommand, targetIndexForMove } from "./V3ItineraryEditor";

          describe("deterministic itinerary editor", () => {
            it("clamps keyboard move targets", () => {
              expect(targetIndexForMove(0, "up", 4)).toBe(0);
              expect(targetIndexForMove(1, "down", 4)).toBe(2);
              expect(targetIndexForMove(3, "down", 4)).toBe(3);
            });

            it("builds a fixed add_day_stop command without coordinates", () => {
              const command = buildAddStopCommand(
                "d1",
                0,
                {
                  id: "c1",
                  placeId: "p1",
                  preference: "must_go",
                  source: "ai",
                  aiReason: "推荐",
                  aiScore: 90,
                  suggestedDurationMinutes: 120,
                  tags: [],
                },
                {
                  id: "p1",
                  nameZh: "清水寺",
                  nameLocal: null,
                  nameEn: null,
                  kind: "attraction",
                  city: "京都",
                  region: null,
                  country: "日本",
                  countryCode: "JP",
                  approximate: false,
                },
                "tmp-stop-1",
              );
              expect(command.type).toBe("add_day_stop");
              expect(JSON.stringify(command)).not.toContain("latitude");
              expect(JSON.stringify(command)).not.toContain("longitude");
