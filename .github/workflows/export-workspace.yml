name: Export v3 implementation workspace

on:
  push:
    branches:
      - codex/v3-runtime-ui-completion
    paths:
      - .github/workflows/export-workspace.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package workspace
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=dist -czf /tmp/travelplanner-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: travelplanner-workspace
          path: /tmp/travelplanner-workspace.tar.gz
          compression-level: 0
          retention-days: 1
