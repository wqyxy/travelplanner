name: UC Narrow Deterministic Scope

on:
  push:
    branches:
      - codex/user-control-correction
    paths:
      - .github/workflows/uc-narrow-deterministic-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/user-control-correction
          fetch-depth: 0
      - name: Narrow deterministic itinerary action scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/server/planner-runtime-v3.ts')
          text = p.read_text()

          old_sig = 'function actionScope(actionType: AiActionType, targetIds: string[], parameters: Record<string, unknown>): ProposalScope {'
          new_sig = 'function actionScope(actionType: AiActionType, targetIds: string[], parameters: Record<string, unknown>, plan: TravelPlanDocument): ProposalScope {'
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          elif new_sig not in text:
              raise SystemExit('actionScope signature not found')

          marker = '''  if (actionType === "itinerary.day.optimize") {\n'''
          insert = '''  const requestedDayId = () => targetIds[0] || (typeof parameters.dayId === "string" ? parameters.dayId : "");\n  const requestedStopId = () => targetIds[0] || (typeof parameters.stopId === "string" ? parameters.stopId : "");\n  const ownerDayForStop = (stopId: string) => plan.days.find((day) => day.stops.some((stop) => stop.id === stopId))?.id ?? null;\n\n  if (actionType === "itinerary.stop.add" || actionType === "itinerary.anchor.set") {\n    const dayId = requestedDayId();\n    if (!dayId || !plan.days.some((day) => day.id === dayId)) throw new Error(`局部行程 Action 引用未知 Day：${dayId || "(missing)"}`);\n    return { type: "day", id: dayId };\n  }\n  if (actionType === "itinerary.stop.remove" || actionType === "itinerary.stop.replace") {\n    const stopId = requestedStopId();\n    const dayId = stopId ? ownerDayForStop(stopId) : null;\n    if (!dayId) throw new Error(`局部行程 Action 引用未知 Stop：${stopId || "(missing)"}`);\n    return { type: "day", id: dayId };\n  }\n  if (actionType === "itinerary.edit") {\n    if (typeof parameters.stopId === "string" && parameters.stopId) {\n      const dayId = ownerDayForStop(parameters.stopId);\n      if (!dayId) throw new Error(`局部行程 Action 引用未知 Stop：${parameters.stopId}`);\n      return { type: "day", id: dayId };\n    }\n    const dayId = requestedDayId();\n    if (!dayId || !plan.days.some((day) => day.id === dayId)) throw new Error(`局部行程 Action 引用未知 Day：${dayId || "(missing)"}`);\n    return { type: "day", id: dayId };\n  }\n  if (actionType === "itinerary.stop.move") {\n    const stopId = requestedStopId();\n    const sourceDayId = stopId ? ownerDayForStop(stopId) : null;\n    const targetDayId = typeof parameters.targetDayId === "string" ? parameters.targetDayId : "";\n    if (!sourceDayId) throw new Error(`局部行程 Action 引用未知 Stop：${stopId || "(missing)"}`);\n    if (!targetDayId || !plan.days.some((day) => day.id === targetDayId)) throw new Error(`局部行程 Action 引用未知目标 Day：${targetDayId || "(missing)"}`);\n    return dayMutationScope([sourceDayId, targetDayId]);\n  }\n\n'''
          if insert not in text:
              if marker not in text:
                  raise SystemExit('actionScope insertion marker not found')
              text = text.replace(marker, insert + marker, 1)

          old1 = 'const scope = actionScope(output.result.actionType, output.result.targetIds, normalizedParameters);'
          new1 = 'const scope = actionScope(output.result.actionType, output.result.targetIds, normalizedParameters, this.options.store.requireTrip(tripId).plan);'
          if old1 in text:
              text = text.replace(old1, new1, 1)
          elif new1 not in text:
              raise SystemExit('conversation actionScope call not found')

          old2 = 'scope: actionScope(input.actionType, targetIds, normalizedParameters), baseGeneration: trip.contentGeneration'
          new2 = 'scope: actionScope(input.actionType, targetIds, normalizedParameters, trip.plan), baseGeneration: trip.contentGeneration'
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif new2 not in text:
              raise SystemExit('CTA actionScope call not found')

          if text.count('function actionScope(') != 1:
              raise SystemExit('actionScope must exist exactly once')
          p.write_text(text)

          Path('.github/workflows/uc-narrow-deterministic-scope.yml').unlink()
          PY
          git diff --check
      - name: Commit scope metadata cleanup
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add apps/server/planner-runtime-v3.ts .github/workflows/uc-narrow-deterministic-scope.yml
          git commit -m "UC5: narrow deterministic itinerary action scopes"
          git push origin codex/user-control-correction
