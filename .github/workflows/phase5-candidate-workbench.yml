          python - <<'PY'
          from pathlib import Path
          path = Path('docs/IMPLEMENTATION_STATUS.md')
          text = path.read_text(encoding='utf-8') if path.exists() else '# TravelPlanner v3 Implementation Status\n'
          import re
          text = re.sub(r'## Current Phase\n\n.*?(?=\n## )', '## Current Phase\n\nPhase 6 — Deterministic itinerary editing and route-dirty UI.\n', text, count=1, flags=re.S)
          phase5 = '''
          ### Phase 5 — Candidate-first Web Workspace

          - The actual React entry now renders a v2 Workspace instead of the legacy itinerary-only application.
          - Added the permanent desktop layout: map on the left and `[地点] [行程]` tabs on the right.
          - Added Candidate filters, individual and batch preference controls, unresolved-place repair, manual coordinates, map/list bidirectional focus and selected-place plan generation.
          - Added Day/Anchor/Stop read views, per-Day route state and explicit route recalculation.
          - Legacy App is retained only as the authentication/local-initialization fallback and is no longer the normal workspace.
          - Phase acceptance includes web/server typecheck, the full test suite and production build.
          '''
          if '### Phase 5 — Candidate-first Web Workspace' not in text:
              marker = '\n## Important Decisions'
              text = text.replace(marker, '\n' + phase5.strip() + '\n' + marker)
          text = re.sub(r'## Next Phase\n\n.*?(?=\n## )', '''## Next Phase

          Phase 6:

          - Add deterministic Stop reorder, cross-Day movement, add/remove Stop, Day reorder and Anchor editing UI.
          - Use only the fixed PlanCommand endpoint with expectedGeneration CAS; no user drag/edit action may call AI.
          - Make route-dirty state visible immediately after every route-input change and keep route recalculation explicit.
          - Add keyboard-accessible alternatives to drag-and-drop.
          ''', text, count=1, flags=re.S)
          path.write_text(text, encoding='utf-8')
          PY

