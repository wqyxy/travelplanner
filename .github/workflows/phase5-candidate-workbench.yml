          .v3-topbar { height: 70px; padding: 0 22px; display: grid; grid-template-columns: minmax(220px, 1fr) minmax(280px, 520px) minmax(180px, 1fr); align-items: center; gap: 18px; background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--v3-line); position: relative; z-index: 20; }
          .v3-brand { display: flex; align-items: center; gap: 11px; }
          .v3-brand > div { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px; color: white; font-weight: 850; background: linear-gradient(145deg, #0f766e, #134e4a); box-shadow: 0 8px 22px rgba(15,118,110,.28); }
          .v3-brand span { display: grid; line-height: 1.05; }
          .v3-brand strong { font-size: 15px; letter-spacing: .01em; }
