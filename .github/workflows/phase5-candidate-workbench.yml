          import { useCallback, useEffect, useState } from "react";
          import LegacyApp from "./LegacyApp";
          import V3Workspace from "./V3Workspace";
          import { ApiError, createTrip, loadTrips, loadWorkspace } from "./v3-api";
          import type { TripSummary, Workspace } from "./v3-types";
          import "./v3-workspace.css";

          type LoadState = "loading" | "ready" | "legacy" | "error";

          export default function App() {
            const [state, setState] = useState<LoadState>("loading");
            const [trips, setTrips] = useState<TripSummary[]>([]);
            const [tripId, setTripId] = useState<string | null>(() => localStorage.getItem("travelplanner.v3.tripId"));
            const [workspace, setWorkspace] = useState<Workspace | null>(null);
            const [error, setError] = useState<string | null>(null);
            const [showCreate, setShowCreate] = useState(false);
            const [title, setTitle] = useState("");
            const [initialMessage, setInitialMessage] = useState("");
            const [creating, setCreating] = useState(false);

            const refreshTrips = useCallback(async () => {
              const rows = await loadTrips();
              setTrips(rows);
              setTripId((current) => {
                const next = current && rows.some((trip) => trip.id === current)
                  ? current
                  : rows[0]?.id ?? null;
                if (next) localStorage.setItem("travelplanner.v3.tripId", next);
                else localStorage.removeItem("travelplanner.v3.tripId");
                return next;
              });
              return rows;
            }, []);

            const refreshWorkspace = useCallback(async () => {
              if (!tripId) {
                setWorkspace(null);
                return;
              }
              const next = await loadWorkspace(tripId);
              setWorkspace(next);
            }, [tripId]);

            useEffect(() => {
              let cancelled = false;
              void refreshTrips()
                .then(() => { if (!cancelled) setState("ready"); })
                .catch((cause) => {
                  if (cancelled) return;
                  if (cause instanceof ApiError && (cause.status === 401 || cause.status === 403 || cause.status === 404)) {
                    setState("legacy");
                  } else {
                    setError(cause instanceof Error ? cause.message : "无法加载旅行列表。");
                    setState("error");
                  }
                });
              return () => { cancelled = true; };
            }, [refreshTrips]);

            useEffect(() => {
              if (state !== "ready" || !tripId) return;
              let cancelled = false;
              setWorkspace(null);
              void loadWorkspace(tripId)
                .then((next) => { if (!cancelled) setWorkspace(next); })
                .catch((cause) => {
                  if (cancelled) return;
                  setError(cause instanceof Error ? cause.message : "无法加载旅行工作区。");
                });
              return () => { cancelled = true; };
            }, [state, tripId]);

            if (state === "legacy") {
              return (
                <div className="v3-legacy-shell">
                  <div className="v3-legacy-notice">
                    <strong>需要先完成登录或本地初始化</strong>
                    <span>完成后刷新页面，即会进入新的 Candidate-first 工作台。</span>
                  </div>
                  <LegacyApp />
                </div>
              );
            }

            if (state === "loading") {
              return <div className="v3-loading-screen"><div className="v3-loader" /><strong>正在打开旅行工作台…</strong></div>;
            }

            return (
              <div className="v3-app-shell">
                <header className="v3-topbar">
                  <div className="v3-brand">
                    <div>TP</div>
                    <span><strong>TravelPlanner</strong><small>AI 旅行工作台</small></span>
                  </div>
                  <div className="v3-trip-switcher">
                    <select
                      aria-label="当前旅行"
                      value={tripId ?? ""}
                      onChange={(event) => {
                        const next = event.target.value || null;
                        setTripId(next);
                        if (next) localStorage.setItem("travelplanner.v3.tripId", next);
                      }}
                    >
                      {!trips.length && <option value="">尚无旅行</option>}
                      {trips.map((trip) => <option value={trip.id} key={trip.id}>{trip.title}</option>)}
                    </select>
                    <button type="button" onClick={() => setShowCreate(true)}>新建旅行</button>
                  </div>
                  <div className="v3-stage-badge">
                    {workspace?.document.stage === "place_selection" ? "地点选择" : workspace?.document.stage === "itinerary_planning" ? "行程规划" : workspace?.document.stage === "itinerary_refinement" ? "行程细化" : "准备中"}
                  </div>
                </header>

                {error && (
                  <div className="v3-global-error" role="alert">
                    <span>{error}</span>
                    <button type="button" onClick={() => setError(null)}>关闭</button>
                  </div>
                )}

                {state === "error" ? (
                  <div className="v3-fatal-state">
                    <h1>新工作台暂时无法启动</h1>
                    <p>{error}</p>
                    <button type="button" onClick={() => location.reload()}>重新加载</button>
                    <button type="button" onClick={() => setState("legacy")}>打开旧设置页</button>
                  </div>
                ) : !tripId ? (
                  <div className="v3-welcome">
                    <p className="v3-eyebrow">DISCOVER → CURATE → PLAN → ROUTE</p>
                    <h1>先选择真正想去的地方，<br />再让 AI 安排成一趟合理旅行。</h1>
                    <p>地图和结构化计划始终在场。AI 负责建议，地图服务负责真实地点与路线，你负责最终选择。</p>
                    <button type="button" onClick={() => setShowCreate(true)}>创建第一趟旅行</button>
                  </div>
                ) : workspace ? (
                  <V3Workspace workspace={workspace} onRefresh={refreshWorkspace} />
                ) : (
                  <div className="v3-loading-screen"><div className="v3-loader" /><strong>正在加载旅行内容…</strong></div>
                )}

                {showCreate && (
                  <div className="v3-modal-backdrop" role="presentation" onMouseDown={() => setShowCreate(false)}>
                    <form
                      className="v3-modal v3-create-modal"
                      onMouseDown={(event) => event.stopPropagation()}
                      onSubmit={(event) => {
                        event.preventDefault();
                        if (!title.trim()) return;
                        setCreating(true);
                        setError(null);
                        void createTrip({ title: title.trim(), initialMessage: initialMessage.trim() })
                          .then(async (trip) => {
                            await refreshTrips();
                            setTripId(trip.id);
                            localStorage.setItem("travelplanner.v3.tripId", trip.id);
                            setShowCreate(false);
                            setTitle("");
                            setInitialMessage("");
                          })
                          .catch((cause) => setError(cause instanceof Error ? cause.message : "创建旅行失败。"))
                          .finally(() => setCreating(false));
                      }}
                    >
                      <p className="v3-eyebrow">NEW TRIP</p>
                      <h2>创建一趟新旅行</h2>
                      <label>旅行名称<input value={title} onChange={(event) => setTitle(event.target.value)} placeholder="日本关西 7 日亲子游" autoFocus /></label>
                      <label>先告诉 AI 你的基本需求<textarea value={initialMessage} onChange={(event) => setInitialMessage(event.target.value)} placeholder="国庆从上海去关西 7 天，夫妻带一个 3 岁孩子，不想太累…" rows={5} /></label>
                      <p className="v3-form-tip">第一步只需最低限度信息，之后先生成地点池，不会直接写满整份行程。</p>
                      <div className="v3-modal-actions">
                        <button type="button" onClick={() => setShowCreate(false)}>取消</button>
                        <button type="submit" disabled={creating || !title.trim()}>{creating ? "创建中…" : "创建旅行"}</button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            );
          }
          EOF

