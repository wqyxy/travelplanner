          import { describe, expect, it } from "vitest";
          import { candidateMatchesFilter, normalizeTripList, normalizeWorkspace } from "./v3-types";

          describe("v3 workspace normalization", () => {
            it("normalizes common trip list envelopes", () => {
              expect(normalizeTripList({ trips: [{ id: "t1", title: "关西", contentGeneration: 3 }] })).toEqual([
                { id: "t1", title: "关西", stage: null, generation: 3, updatedAt: null },
              ]);
            });

            it("normalizes the canonical v2 workspace", () => {
              const result = normalizeWorkspace({
                tripId: "t1",
                generation: 4,
                document: {
                  schemaVersion: 2,
                  stage: "place_selection",
                  trip: { title: "关西" },
                  places: [],
                  candidates: [],
                  days: [],
                  warnings: [],
                },
                placeResolutions: [],
                dayRoutes: [],
                routeDirtyDayIds: ["d1"],
              });
              expect(result.tripId).toBe("t1");
              expect(result.generation).toBe(4);
              expect(result.document.trip.title).toBe("关西");
              expect(result.routeDirtyDayIds).toEqual(["d1"]);
            });

            it("does not treat an unresolved Candidate as resolved", () => {
              const candidate = {
                id: "c1",
                placeId: "p1",
                preference: "optional" as const,
                source: "ai" as const,
                aiReason: null,
                aiScore: null,
                suggestedDurationMinutes: null,
                tags: [],
              };
              expect(candidateMatchesFilter(candidate, "unresolved", undefined)).toBe(true);
              expect(candidateMatchesFilter(candidate, "must_go", undefined)).toBe(false);
            });
          });
