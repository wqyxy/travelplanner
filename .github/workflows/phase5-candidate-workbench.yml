name: Implement Phase 5 candidate-first web workbench

on:
  push:
    branches:
      - codex/v3-runtime-ui-completion
    paths:
      - .github/workflows/phase5-candidate-workbench.yml

permissions:
  contents: write

concurrency:
  group: travelplanner-phase5
  cancel-in-progress: false

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Phase 5 web application
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f apps/web/src/App.tsx && ! -f apps/web/src/LegacyApp.tsx ]]; then
            mv apps/web/src/App.tsx apps/web/src/LegacyApp.tsx
          fi

          cat > apps/web/src/v3-types.ts <<'EOF'
          export type CandidatePreference = "must_go" | "want_to_go" | "optional" | "excluded";
          export type TripStage = "place_selection" | "itinerary_planning" | "itinerary_refinement";
          export type ResolutionStatus = "resolving" | "resolved" | "unresolved";

          export type TripSummary = {
            id: string;
            title: string;
            stage: TripStage | null;
            generation: number | null;
            updatedAt: string | null;
          };

          export type Place = {
            id: string;
            nameZh: string;
            nameLocal: string | null;
            nameEn: string | null;
            kind: string;
            city: string | null;
            region: string | null;
            country: string | null;
            countryCode: string | null;
            approximate: boolean;
          };

          export type TripCandidate = {
            id: string;
            placeId: string;
            preference: CandidatePreference;
            source: "ai" | "user";
            aiReason: string | null;
            aiScore: number | null;
            suggestedDurationMinutes: number | null;
            tags: string[];
          };

          export type DayAnchor = {
            id: string;
            placeId: string | null;
            label: string | null;
            notes: string | null;
          };

          export type DayStop = {
            id: string;
            candidateId: string | null;
            placeId: string;
            activity: string;
            period: string | null;
            startTime: string | null;
            endTime: string | null;
            durationMinutes: number | null;
            transportFromPrevious: {
              mode: string;
              durationMinutes: number | null;
              note: string | null;
            } | null;
            notes: string | null;
          };

          export type Day = {
            id: string;
            dayNumber: number;
            date: string | null;
            title: string;
            detailLevel: "planned" | "detailed";
            detailStatus: "ready" | "needs_review" | null;
            startAnchor: DayAnchor;
            stops: DayStop[];
            endAnchor: DayAnchor;
          };

          export type TravelPlanDocument = {
            schemaVersion: 2;
            stage: TripStage;
            trip: {
              title: string;
              dates?: {
                start: string | null;
                end: string | null;
                requestedDurationDays: number | null;
              };
              travelers?: {
                summary: string;
                adults: number | null;
                children: number | null;
              };
              [key: string]: unknown;
            };
            places: Place[];
            candidates: TripCandidate[];
            days: Day[];
            warnings: string[];
          };

          export type PlaceResolution = {
            tripId: string;
            placeId: string;
            status: ResolutionStatus;
            method: string;
            provider: string | null;
            providerPlaceId: string | null;
            latitude: number | null;
            longitude: number | null;
            address: string | null;
            confidence: number | null;
            errorMessage: string | null;
          };

          export type DayRoute = {
            tripId: string;
            dayId: string;
            version: number;
            inputFingerprint: string;
            status: "idle" | "calculating" | "ready" | "attention";
            distanceKm: number | null;
            durationMinutes: number | null;
            geometry: unknown | null;
            warnings: string[];
            calculatedAt: string | null;
          };

          export type Workspace = {
            tripId: string;
            generation: number;
            document: TravelPlanDocument;
            resolutions: PlaceResolution[];
            routes: DayRoute[];
            routeDirtyDayIds: string[];
            proposals: unknown[];
            messages: unknown[];
            tasks: unknown[];
          };

          const emptyDocument = (title = "未命名旅行"): TravelPlanDocument => ({
            schemaVersion: 2,
            stage: "place_selection",
            trip: {
              title,
              dates: { start: null, end: null, requestedDurationDays: null },
              travelers: { summary: "", adults: null, children: null },
            },
            places: [],
            candidates: [],
            days: [],
            warnings: [],
          });

          const asRecord = (value: unknown): Record<string, unknown> =>
            value && typeof value === "object" && !Array.isArray(value)
              ? value as Record<string, unknown>
              : {};

          const asArray = <T>(value: unknown): T[] => Array.isArray(value) ? value as T[] : [];
          const asNumber = (value: unknown, fallback = 0): number =>
            typeof value === "number" && Number.isFinite(value) ? value : fallback;
          const asString = (value: unknown, fallback = ""): string =>
            typeof value === "string" ? value : fallback;

          export function normalizeTripList(raw: unknown): TripSummary[] {
            const root = asRecord(raw);
            const rows = Array.isArray(raw)
              ? raw
              : asArray<unknown>(root.trips ?? root.items ?? root.data);
            return rows.map((entry) => {
              const row = asRecord(entry);
              return {
                id: asString(row.id ?? row.tripId),
                title: asString(row.title ?? row.name, "未命名旅行"),
                stage: typeof row.stage === "string" ? row.stage as TripStage : null,
                generation: typeof row.generation === "number"
                  ? row.generation
                  : typeof row.contentGeneration === "number"
                    ? row.contentGeneration
                    : null,
                updatedAt: typeof row.updatedAt === "string" ? row.updatedAt : null,
              };
            }).filter((trip) => trip.id.length > 0);
          }

          export function normalizeWorkspace(raw: unknown, fallbackTripId = ""): Workspace {
            const outer = asRecord(raw);
            const root = asRecord(outer.workspace ?? outer.data ?? raw);
            const tripRecord = asRecord(root.tripRecord ?? root.trip);
            const possibleDocument = root.document
              ?? root.plan
              ?? root.currentPlan
              ?? tripRecord.document
              ?? tripRecord.plan;
            const parsedDocument = asRecord(possibleDocument);
            const title = asString(tripRecord.title ?? root.title, "未命名旅行");
            const document = parsedDocument.schemaVersion === 2
              ? parsedDocument as unknown as TravelPlanDocument
              : emptyDocument(title);
            const tripId = asString(root.tripId ?? tripRecord.id ?? outer.tripId, fallbackTripId);
            const dirty = root.routeDirtyDayIds
              ?? root.dirtyRouteDayIds
              ?? asRecord(root.routeState).dirtyDayIds;
            return {
              tripId,
              generation: asNumber(
                root.generation
                ?? root.contentGeneration
                ?? tripRecord.generation
                ?? tripRecord.contentGeneration,
                0,
              ),
              document,
              resolutions: asArray<PlaceResolution>(root.resolutions ?? root.placeResolutions),
              routes: asArray<DayRoute>(root.routes ?? root.dayRoutes),
              routeDirtyDayIds: asArray<string>(dirty),
              proposals: asArray(root.proposals),
              messages: asArray(root.messages),
              tasks: asArray(root.tasks ?? root.aiTasks),
            };
          }

          export function placeDisplayName(place: Place | undefined): string {
            if (!place) return "未知地点";
            return place.nameZh || place.nameLocal || place.nameEn || "未命名地点";
          }

          export function formatDuration(minutes: number | null | undefined): string {
            if (minutes === null || minutes === undefined || !Number.isFinite(minutes)) return "";
            if (minutes < 60) return `${Math.round(minutes)} 分钟`;
            const hours = minutes / 60;
            return Number.isInteger(hours) ? `${hours} 小时` : `${hours.toFixed(1)} 小时`;
          }

          export type CandidateFilter = "all" | CandidatePreference | "unresolved";

          export function candidateMatchesFilter(
            candidate: TripCandidate,
            filter: CandidateFilter,
            resolution: PlaceResolution | undefined,
          ): boolean {
            if (filter === "all") return true;
            if (filter === "unresolved") return !resolution || resolution.status !== "resolved";
            return candidate.preference === filter;
          }
          EOF

          cat > apps/web/src/v3-api.ts <<'EOF'
          import type { CandidatePreference, TripSummary, Workspace } from "./v3-types";
          import { normalizeTripList, normalizeWorkspace } from "./v3-types";

          export class ApiError extends Error {
            constructor(
              message: string,
              public readonly status: number,
              public readonly payload: unknown,
            ) {
              super(message);
              this.name = "ApiError";
            }
          }

          async function apiJson<T>(path: string, init?: RequestInit): Promise<T> {
            const response = await fetch(path, {
              credentials: "same-origin",
              ...init,
              headers: {
                Accept: "application/json",
                ...(init?.body ? { "Content-Type": "application/json" } : {}),
                ...init?.headers,
              },
            });
            const text = await response.text();
            let payload: unknown = null;
            if (text) {
              try { payload = JSON.parse(text); }
              catch { payload = text; }
            }
            if (!response.ok) {
              const record = payload && typeof payload === "object" ? payload as Record<string, unknown> : {};
              const message = typeof record.error === "string"
                ? record.error
                : typeof record.message === "string"
                  ? record.message
                  : `请求失败（${response.status}）`;
              throw new ApiError(message, response.status, payload);
            }
            return payload as T;
          }

          const body = (value: unknown): string => JSON.stringify(value);

          export async function loadTrips(): Promise<TripSummary[]> {
            return normalizeTripList(await apiJson<unknown>("/api/trips"));
          }

          export async function createTrip(input: {
            title: string;
            initialMessage: string;
          }): Promise<TripSummary> {
            const raw = await apiJson<unknown>("/api/trips", {
              method: "POST",
              body: body({
                title: input.title,
                initialMessage: input.initialMessage,
                message: input.initialMessage,
              }),
            });
            const trips = normalizeTripList([raw]);
            if (trips[0]) return trips[0];
            const record = raw && typeof raw === "object" ? raw as Record<string, unknown> : {};
            const nested = record.trip && typeof record.trip === "object"
              ? record.trip as Record<string, unknown>
              : record;
            const id = String(nested.id ?? nested.tripId ?? "");
            if (!id) throw new Error("服务端没有返回新旅行 ID。");
            return {
              id,
              title: String(nested.title ?? input.title),
              stage: null,
              generation: null,
              updatedAt: null,
            };
          }

          export async function loadWorkspace(tripId: string): Promise<Workspace> {
            return normalizeWorkspace(
              await apiJson<unknown>(`/api/trips/${encodeURIComponent(tripId)}/workspace`),
              tripId,
            );
          }

          export async function discoverCandidates(
            tripId: string,
            generation: number,
            prompt: string,
          ): Promise<void> {
            await apiJson(`/api/trips/${encodeURIComponent(tripId)}/candidates/discover`, {
              method: "POST",
              body: body({ expectedGeneration: generation, prompt, message: prompt }),
            });
          }

          export async function setCandidatePreference(
            tripId: string,
            candidateId: string,
            preference: CandidatePreference,
            generation: number,
          ): Promise<void> {
            await apiJson(`/api/trips/${encodeURIComponent(tripId)}/candidates/${encodeURIComponent(candidateId)}`, {
              method: "PATCH",
              body: body({ expectedGeneration: generation, preference }),
            });
          }

          export async function setCandidatePreferences(
            tripId: string,
            candidateIds: string[],
            preference: CandidatePreference,
            generation: number,
          ): Promise<void> {
            await apiJson(`/api/trips/${encodeURIComponent(tripId)}/candidates/batch`, {
              method: "POST",
              body: body({ expectedGeneration: generation, candidateIds, preference }),
            });
          }

          export async function retryResolutions(
            tripId: string,
            placeIds: string[],
            generation: number,
          ): Promise<void> {
            await apiJson(`/api/trips/${encodeURIComponent(tripId)}/resolutions/retry`, {
              method: "POST",
              body: body({ expectedGeneration: generation, placeIds }),
            });
          }

          export async function setManualCoordinates(
            tripId: string,
            placeId: string,
            latitude: number,
            longitude: number,
            generation: number,
          ): Promise<void> {
            await apiJson(`/api/trips/${encodeURIComponent(tripId)}/resolutions/${encodeURIComponent(placeId)}/manual`, {
              method: "PUT",
              body: body({ expectedGeneration: generation, latitude, longitude }),
            });
          }

          export async function generatePlan(tripId: string, generation: number): Promise<void> {
            await apiJson(`/api/trips/${encodeURIComponent(tripId)}/plan/generate`, {
              method: "POST",
              body: body({ expectedGeneration: generation }),
            });
          }

          export async function recalculateRoute(
            tripId: string,
            dayId: string,
            generation: number,
          ): Promise<void> {
            await apiJson(`/api/trips/${encodeURIComponent(tripId)}/routes/${encodeURIComponent(dayId)}/recalculate`, {
              method: "POST",
              body: body({ expectedGeneration: generation }),
            });
          }
          EOF

          cat > apps/web/src/V3Map.tsx <<'EOF'
          import { useEffect, useMemo, useRef } from "react";
          import maplibregl from "maplibre-gl";
          import "maplibre-gl/dist/maplibre-gl.css";
          import type { DayRoute, Place, PlaceResolution } from "./v3-types";
          import { placeDisplayName } from "./v3-types";

          type Location = {
            place: Place;
            resolution: PlaceResolution;
            ordinal: number | null;
          };

          type Props = {
            locations: Location[];
            selectedPlaceId: string | null;
            selectedRoute: DayRoute | null;
            onSelectPlace: (placeId: string) => void;
          };

          const routeSourceId = "v3-selected-route";
          const routeLayerId = "v3-selected-route-line";

          function routeGeoJson(route: DayRoute | null): GeoJSON.FeatureCollection | null {
            if (!route?.geometry || typeof route.geometry !== "object") return null;
            const geometry = route.geometry as GeoJSON.Geometry;
            if (!geometry.type) return null;
            return {
              type: "FeatureCollection",
              features: [{ type: "Feature", properties: {}, geometry }],
            };
          }

          export default function V3Map({ locations, selectedPlaceId, selectedRoute, onSelectPlace }: Props) {
            const containerRef = useRef<HTMLDivElement | null>(null);
            const mapRef = useRef<maplibregl.Map | null>(null);
            const markersRef = useRef<maplibregl.Marker[]>([]);
            const onSelectRef = useRef(onSelectPlace);
            onSelectRef.current = onSelectPlace;

            const pointsKey = useMemo(
              () => locations
                .map(({ place, resolution }) => `${place.id}:${resolution.longitude}:${resolution.latitude}`)
                .join("|"),
              [locations],
            );

            useEffect(() => {
              if (!containerRef.current || mapRef.current) return;
              const map = new maplibregl.Map({
                container: containerRef.current,
                center: [105, 35],
                zoom: 2.4,
                attributionControl: true,
                style: {
                  version: 8,
                  sources: {
                    osm: {
                      type: "raster",
                      tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                      tileSize: 256,
                      attribution: "© OpenStreetMap contributors",
                    },
                  },
                  layers: [{ id: "osm", type: "raster", source: "osm" }],
                },
              });
              map.addControl(new maplibregl.NavigationControl({ showCompass: true }), "bottom-left");
              mapRef.current = map;
              return () => {
                markersRef.current.forEach((marker) => marker.remove());
                markersRef.current = [];
                map.remove();
                mapRef.current = null;
              };
            }, []);

            useEffect(() => {
              const map = mapRef.current;
              if (!map) return;
              markersRef.current.forEach((marker) => marker.remove());
              markersRef.current = [];
              const bounds = new maplibregl.LngLatBounds();
              for (const { place, resolution, ordinal } of locations) {
                if (resolution.latitude === null || resolution.longitude === null) continue;
                const button = document.createElement("button");
                button.type = "button";
                button.className = `v3-map-marker${selectedPlaceId === place.id ? " is-selected" : ""}`;
                button.title = placeDisplayName(place);
                button.setAttribute("aria-label", `在列表中查看 ${placeDisplayName(place)}`);
                button.textContent = ordinal === null ? "•" : String(ordinal);
                button.addEventListener("click", () => onSelectRef.current(place.id));
                const marker = new maplibregl.Marker({ element: button, anchor: "bottom" })
                  .setLngLat([resolution.longitude, resolution.latitude])
                  .addTo(map);
                markersRef.current.push(marker);
                bounds.extend([resolution.longitude, resolution.latitude]);
              }
              if (!bounds.isEmpty()) {
                map.fitBounds(bounds, { padding: 80, maxZoom: 13, duration: 500 });
              }
            }, [pointsKey, selectedPlaceId, locations]);

            useEffect(() => {
              const map = mapRef.current;
              if (!map) return;
              const syncRoute = () => {
                if (map.getLayer(routeLayerId)) map.removeLayer(routeLayerId);
                if (map.getSource(routeSourceId)) map.removeSource(routeSourceId);
                const data = routeGeoJson(selectedRoute);
                if (!data) return;
                map.addSource(routeSourceId, { type: "geojson", data });
                map.addLayer({
                  id: routeLayerId,
                  type: "line",
                  source: routeSourceId,
                  paint: {
                    "line-color": "#0f766e",
                    "line-width": 5,
                    "line-opacity": 0.85,
                  },
                });
              };
              if (map.loaded()) syncRoute();
              else map.once("load", syncRoute);
            }, [selectedRoute]);

            return (
              <div className="v3-map-shell">
                <div ref={containerRef} className="v3-map" aria-label="旅行地图" />
                <div className="v3-map-caption">
                  <strong>{locations.length}</strong> 个已定位地点
                  <span>点击标记可定位到右侧卡片</span>
                </div>
              </div>
            );
          }
          EOF

          cat > apps/web/src/V3Workspace.tsx <<'EOF'
          import { useEffect, useMemo, useRef, useState } from "react";
          import V3Map from "./V3Map";
          import {
            discoverCandidates,
            generatePlan,
            recalculateRoute,
            retryResolutions,
            setCandidatePreference,
            setCandidatePreferences,
            setManualCoordinates,
          } from "./v3-api";
          import type {
            CandidateFilter,
            CandidatePreference,
            Day,
            Place,
            PlaceResolution,
            TripCandidate,
            Workspace,
          } from "./v3-types";
          import {
            candidateMatchesFilter,
            formatDuration,
            placeDisplayName,
          } from "./v3-types";

          type Props = {
            workspace: Workspace;
            onRefresh: () => Promise<void>;
          };

          const preferenceLabels: Record<CandidatePreference, string> = {
            must_go: "必去",
            want_to_go: "想去",
            optional: "可选",
            excluded: "不去",
          };

          const filters: Array<{ value: CandidateFilter; label: string }> = [
            { value: "all", label: "全部" },
            { value: "must_go", label: "必去" },
            { value: "want_to_go", label: "想去" },
            { value: "optional", label: "可选" },
            { value: "excluded", label: "不去" },
            { value: "unresolved", label: "未定位" },
          ];

          function CandidateCard({
            candidate,
            place,
            resolution,
            selected,
            active,
            onToggle,
            onFocus,
            onPreference,
            onRetry,
            onManual,
          }: {
            candidate: TripCandidate;
            place: Place | undefined;
            resolution: PlaceResolution | undefined;
            selected: boolean;
            active: boolean;
            onToggle: () => void;
            onFocus: () => void;
            onPreference: (preference: CandidatePreference) => void;
            onRetry: () => void;
            onManual: () => void;
          }) {
            const title = placeDisplayName(place);
            return (
              <article
                id={`candidate-${candidate.id}`}
                className={`v3-candidate-card${active ? " is-active" : ""}`}
                onClick={onFocus}
              >
                <div className="v3-candidate-head">
                  <label className="v3-check" onClick={(event) => event.stopPropagation()}>
                    <input type="checkbox" checked={selected} onChange={onToggle} />
                    <span className="sr-only">选择 {title}</span>
                  </label>
                  <div className="v3-candidate-title-wrap">
                    <h3>{title}</h3>
                    <p>{[place?.city, place?.region, place?.country].filter(Boolean).join(" · ") || place?.kind || "地点"}</p>
                  </div>
                  {candidate.aiScore !== null && (
                    <div className="v3-score" title="AI 推荐度，不是地图评分">
                      <strong>{Math.round(candidate.aiScore)}</strong>
                      <span>AI 推荐</span>
                    </div>
                  )}
                </div>

                {candidate.aiReason && <p className="v3-reason">{candidate.aiReason}</p>}

                <div className="v3-candidate-meta">
                  {candidate.suggestedDurationMinutes !== null && (
                    <span>{formatDuration(candidate.suggestedDurationMinutes)}</span>
                  )}
                  {candidate.tags.slice(0, 4).map((tag) => <span key={tag}>{tag}</span>)}
                  <span className={`v3-resolution is-${resolution?.status ?? "unresolved"}`}>
                    {resolution?.status === "resolved" ? "已定位" : resolution?.status === "resolving" ? "定位中" : "未定位"}
                  </span>
                </div>

                <div className="v3-preference-row" onClick={(event) => event.stopPropagation()}>
                  {(Object.keys(preferenceLabels) as CandidatePreference[]).map((preference) => (
                    <button
                      type="button"
                      key={preference}
                      className={candidate.preference === preference ? "is-current" : ""}
                      onClick={() => onPreference(preference)}
                    >
                      {preferenceLabels[preference]}
                    </button>
                  ))}
                </div>

                {resolution?.status !== "resolved" && (
                  <div className="v3-resolution-actions" onClick={(event) => event.stopPropagation()}>
                    <button type="button" onClick={onRetry}>重新定位</button>
                    <button type="button" onClick={onManual}>手工坐标</button>
                    {resolution?.errorMessage && <small>{resolution.errorMessage}</small>}
                  </div>
                )}
              </article>
            );
          }

          function Anchor({ label, place }: { label: string; place: Place | undefined }) {
            return (
              <div className="v3-anchor">
                <span>{label}</span>
                <strong>{place ? placeDisplayName(place) : "尚未设置"}</strong>
              </div>
            );
          }

          function DayCard({
            day,
            places,
            dirty,
            routeDistance,
            routeDuration,
            selected,
            onSelect,
            onRoute,
            onPlace,
          }: {
            day: Day;
            places: Map<string, Place>;
            dirty: boolean;
            routeDistance: number | null;
            routeDuration: number | null;
            selected: boolean;
            onSelect: () => void;
            onRoute: () => void;
            onPlace: (placeId: string) => void;
          }) {
            return (
              <article className={`v3-day-card${selected ? " is-active" : ""}`}>
                <button type="button" className="v3-day-heading" onClick={onSelect}>
                  <span>DAY {day.dayNumber}</span>
                  <strong>{day.title}</strong>
                  <small>{day.date ?? "日期待定"}</small>
                </button>
                <div className="v3-day-body">
                  <Anchor label="起点" place={day.startAnchor.placeId ? places.get(day.startAnchor.placeId) : undefined} />
                  <div className="v3-stop-list">
                    {day.stops.length === 0 && <p className="v3-empty-inline">这一天还没有地点。</p>}
                    {day.stops.map((stop, index) => (
                      <button
                        type="button"
                        className="v3-stop"
                        key={stop.id}
                        onClick={() => onPlace(stop.placeId)}
                      >
                        <span>{index + 1}</span>
                        <div>
                          <strong>{placeDisplayName(places.get(stop.placeId))}</strong>
                          <small>
                            {[stop.period, formatDuration(stop.durationMinutes)].filter(Boolean).join(" · ") || stop.activity}
                          </small>
                        </div>
                      </button>
                    ))}
                  </div>
                  <Anchor label="终点" place={day.endAnchor.placeId ? places.get(day.endAnchor.placeId) : undefined} />
                  <div className="v3-route-status">
                    <div>
                      <span className={dirty ? "is-dirty" : "is-ready"}>{dirty ? "路线有变更" : "路线已更新"}</span>
                      {(routeDistance !== null || routeDuration !== null) && (
                        <small>
                          {routeDistance !== null ? `${routeDistance.toFixed(1)} km` : ""}
                          {routeDistance !== null && routeDuration !== null ? " · " : ""}
                          {routeDuration !== null ? formatDuration(routeDuration) : ""}
                        </small>
                      )}
                    </div>
                    <button type="button" onClick={onRoute}>{dirty ? "更新路线" : "重新计算"}</button>
                  </div>
                </div>
              </article>
            );
          }

          export default function V3Workspace({ workspace, onRefresh }: Props) {
            const [tab, setTab] = useState<"places" | "itinerary">(
              workspace.document.stage === "place_selection" ? "places" : "itinerary",
            );
            const [filter, setFilter] = useState<CandidateFilter>("all");
            const [selectedCandidates, setSelectedCandidates] = useState<Set<string>>(new Set());
            const [selectedPlaceId, setSelectedPlaceId] = useState<string | null>(null);
            const [selectedDayId, setSelectedDayId] = useState<string | null>(workspace.document.days[0]?.id ?? null);
            const [prompt, setPrompt] = useState("");
            const [busy, setBusy] = useState<string | null>(null);
            const [error, setError] = useState<string | null>(null);
            const [manualPlaceId, setManualPlaceId] = useState<string | null>(null);
            const [latitude, setLatitude] = useState("");
            const [longitude, setLongitude] = useState("");
            const listRef = useRef<HTMLDivElement | null>(null);

            const places = useMemo(
              () => new Map(workspace.document.places.map((place) => [place.id, place])),
              [workspace.document.places],
            );
            const resolutions = useMemo(
              () => new Map(workspace.resolutions.map((resolution) => [resolution.placeId, resolution])),
              [workspace.resolutions],
            );
            const routes = useMemo(
              () => new Map(workspace.routes.map((route) => [route.dayId, route])),
              [workspace.routes],
            );
            const dirtyDays = useMemo(
              () => new Set(workspace.routeDirtyDayIds),
              [workspace.routeDirtyDayIds],
            );

            const visibleCandidates = workspace.document.candidates.filter((candidate) =>
              candidateMatchesFilter(candidate, filter, resolutions.get(candidate.placeId)),
            );
            const selectedCount = workspace.document.candidates.filter((candidate) => candidate.preference !== "excluded").length;
            const unresolvedCount = workspace.document.candidates.filter((candidate) =>
              resolutions.get(candidate.placeId)?.status !== "resolved",
            ).length;

            const selectedDay = workspace.document.days.find((day) => day.id === selectedDayId) ?? null;
            const dayPlaceIds = new Set<string>();
            if (selectedDay) {
              if (selectedDay.startAnchor.placeId) dayPlaceIds.add(selectedDay.startAnchor.placeId);
              selectedDay.stops.forEach((stop) => dayPlaceIds.add(stop.placeId));
              if (selectedDay.endAnchor.placeId) dayPlaceIds.add(selectedDay.endAnchor.placeId);
            }

            const mapLocations = workspace.document.places.flatMap((place) => {
              const resolution = resolutions.get(place.id);
              if (!resolution || resolution.status !== "resolved" || resolution.latitude === null || resolution.longitude === null) return [];
              if (tab === "itinerary" && selectedDay && !dayPlaceIds.has(place.id)) return [];
              const ordinal = selectedDay
                ? selectedDay.stops.findIndex((stop) => stop.placeId === place.id) + 1
                : null;
              return [{ place, resolution, ordinal: ordinal && ordinal > 0 ? ordinal : null }];
            });

            const run = async (label: string, operation: () => Promise<void>) => {
              setBusy(label);
              setError(null);
              try {
                await operation();
                await onRefresh();
              } catch (cause) {
                setError(cause instanceof Error ? cause.message : "操作失败，请稍后重试。");
              } finally {
                setBusy(null);
              }
            };

            const focusPlace = (placeId: string) => {
              setSelectedPlaceId(placeId);
              if (tab === "places") {
                const candidate = workspace.document.candidates.find((item) => item.placeId === placeId);
                if (candidate) {
                  requestAnimationFrame(() => {
                    document.getElementById(`candidate-${candidate.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" });
                  });
                }
              }
            };

            useEffect(() => {
              if (selectedPlaceId && !places.has(selectedPlaceId)) setSelectedPlaceId(null);
            }, [places, selectedPlaceId]);

            return (
              <main className="v3-workspace">
                <section className="v3-map-column">
                  <V3Map
                    locations={mapLocations}
                    selectedPlaceId={selectedPlaceId}
                    selectedRoute={selectedDay ? routes.get(selectedDay.id) ?? null : null}
                    onSelectPlace={focusPlace}
                  />
                </section>

                <section className="v3-panel-column">
                  <div className="v3-tabs" role="tablist" aria-label="旅行工作区">
                    <button type="button" className={tab === "places" ? "is-active" : ""} onClick={() => setTab("places")}>
                      地点 <span>{selectedCount}/{workspace.document.candidates.length}</span>
                    </button>
                    <button type="button" className={tab === "itinerary" ? "is-active" : ""} onClick={() => setTab("itinerary")}>
                      行程 <span>{workspace.document.days.length} 天</span>
                    </button>
                  </div>

                  {error && <div className="v3-error" role="alert">{error}</div>}

                  {tab === "places" ? (
                    <div className="v3-tab-content" ref={listRef}>
                      <div className="v3-section-head">
                        <div>
                          <p className="v3-eyebrow">DISCOVER & CURATE</p>
                          <h2>先选择真正想去的地方</h2>
                          <p>AI 推荐语义地点，地图服务负责真实坐标。排除的地点不会进入行程。</p>
                        </div>
                        <button
                          type="button"
                          className="v3-primary-button"
                          disabled={busy !== null}
                          onClick={() => run("discover", () => discoverCandidates(workspace.tripId, workspace.generation, prompt.trim()))}
                        >
                          {busy === "discover" ? "生成中…" : workspace.document.candidates.length ? "继续推荐" : "AI 推荐地点"}
                        </button>
                      </div>

                      <div className="v3-discovery-prompt">
                        <input
                          value={prompt}
                          onChange={(event) => setPrompt(event.target.value)}
                          placeholder="例如：多推荐一些适合 3 岁孩子的室内地点"
                        />
                      </div>

                      <div className="v3-filter-row">
                        {filters.map((item) => (
                          <button
                            type="button"
                            key={item.value}
                            className={filter === item.value ? "is-active" : ""}
                            onClick={() => setFilter(item.value)}
                          >
                            {item.label}
                            {item.value === "unresolved" && unresolvedCount > 0 ? ` ${unresolvedCount}` : ""}
                          </button>
                        ))}
                      </div>

                      {selectedCandidates.size > 0 && (
                        <div className="v3-bulk-bar">
                          <strong>已选择 {selectedCandidates.size} 个</strong>
                          {(Object.keys(preferenceLabels) as CandidatePreference[]).map((preference) => (
                            <button
                              type="button"
                              key={preference}
                              disabled={busy !== null}
                              onClick={() => run(`bulk-${preference}`, () => setCandidatePreferences(
                                workspace.tripId,
                                [...selectedCandidates],
                                preference,
                                workspace.generation,
                              )).then(() => setSelectedCandidates(new Set()))}
                            >
                              标记{preferenceLabels[preference]}
                            </button>
                          ))}
                          <button
                            type="button"
                            disabled={busy !== null}
                            onClick={() => {
                              const placeIds = workspace.document.candidates
                                .filter((candidate) => selectedCandidates.has(candidate.id))
                                .map((candidate) => candidate.placeId);
                              void run("bulk-resolve", () => retryResolutions(workspace.tripId, placeIds, workspace.generation));
                            }}
                          >
                            批量重新定位
                          </button>
                        </div>
                      )}

                      <div className="v3-card-list">
                        {visibleCandidates.length === 0 && (
                          <div className="v3-empty-state">
                            <div>✦</div>
                            <h3>{workspace.document.candidates.length ? "当前筛选没有地点" : "还没有 Candidate Pool"}</h3>
                            <p>{workspace.document.candidates.length ? "切换筛选条件，或让 AI 继续推荐。" : "描述你的偏好后，让 AI 先推荐地点，再决定哪些值得加入旅行。"}</p>
                          </div>
                        )}
                        {visibleCandidates.map((candidate) => (
                          <CandidateCard
                            key={candidate.id}
                            candidate={candidate}
                            place={places.get(candidate.placeId)}
                            resolution={resolutions.get(candidate.placeId)}
                            selected={selectedCandidates.has(candidate.id)}
                            active={selectedPlaceId === candidate.placeId}
                            onToggle={() => {
                              const next = new Set(selectedCandidates);
                              if (next.has(candidate.id)) next.delete(candidate.id);
                              else next.add(candidate.id);
                              setSelectedCandidates(next);
                            }}
                            onFocus={() => focusPlace(candidate.placeId)}
                            onPreference={(preference) => void run(`preference-${candidate.id}`, () => setCandidatePreference(
                              workspace.tripId,
                              candidate.id,
                              preference,
                              workspace.generation,
                            ))}
                            onRetry={() => void run(`resolve-${candidate.placeId}`, () => retryResolutions(
                              workspace.tripId,
                              [candidate.placeId],
                              workspace.generation,
                            ))}
                            onManual={() => {
                              setManualPlaceId(candidate.placeId);
                              setLatitude("");
                              setLongitude("");
                            }}
                          />
                        ))}
                      </div>

                      <div className="v3-plan-cta">
                        <div>
                          <strong>已选择 {selectedCount} / {workspace.document.candidates.length} 个地点</strong>
                          <span>{unresolvedCount ? `其中 ${unresolvedCount} 个尚未定位` : "所有 Candidate 均已获得定位状态"}</span>
                        </div>
                        <button
                          type="button"
                          disabled={busy !== null || selectedCount === 0 || workspace.document.days.length > 0}
                          onClick={() => void run("plan", () => generatePlan(workspace.tripId, workspace.generation)).then(() => setTab("itinerary"))}
                        >
                          {workspace.document.days.length > 0 ? "行程已经生成" : busy === "plan" ? "正在排程…" : "根据选中地点生成行程"}
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="v3-tab-content">
                      <div className="v3-section-head">
                        <div>
                          <p className="v3-eyebrow">PLAN & ROUTE</p>
                          <h2>按天查看结构化行程</h2>
                          <p>每天拥有独立起点和终点。路线只在你明确点击时重新计算。</p>
                        </div>
                        <button type="button" className="v3-secondary-button" onClick={() => setTab("places")}>返回地点池</button>
                      </div>

                      <div className="v3-day-selector">
                        {workspace.document.days.map((day) => (
                          <button
                            type="button"
                            key={day.id}
                            className={selectedDayId === day.id ? "is-active" : ""}
                            onClick={() => setSelectedDayId(day.id)}
                          >
                            D{day.dayNumber}
                          </button>
                        ))}
                      </div>

                      <div className="v3-card-list">
                        {workspace.document.days.length === 0 && (
                          <div className="v3-empty-state">
                            <div>↗</div>
                            <h3>还没有按天行程</h3>
                            <p>先到“地点”Tab 选择 Candidate，再让 AI 根据真实地点安排每天。</p>
                            <button type="button" onClick={() => setTab("places")}>去选择地点</button>
                          </div>
                        )}
                        {workspace.document.days.map((day) => {
                          const route = routes.get(day.id);
                          return (
                            <DayCard
                              key={day.id}
                              day={day}
                              places={places}
                              dirty={dirtyDays.has(day.id) || !route}
                              routeDistance={route?.distanceKm ?? null}
                              routeDuration={route?.durationMinutes ?? null}
                              selected={selectedDayId === day.id}
                              onSelect={() => setSelectedDayId(day.id)}
                              onRoute={() => void run(`route-${day.id}`, () => recalculateRoute(workspace.tripId, day.id, workspace.generation))}
                              onPlace={focusPlace}
                            />
                          );
                        })}
                      </div>
                    </div>
                  )}
                </section>

                {manualPlaceId && (
                  <div className="v3-modal-backdrop" role="presentation" onMouseDown={() => setManualPlaceId(null)}>
                    <form
                      className="v3-modal"
                      onMouseDown={(event) => event.stopPropagation()}
                      onSubmit={(event) => {
                        event.preventDefault();
                        const lat = Number(latitude);
                        const lon = Number(longitude);
                        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                          setError("请输入有效的纬度和经度。");
                          return;
                        }
                        void run("manual", () => setManualCoordinates(
                          workspace.tripId,
                          manualPlaceId,
                          lat,
                          lon,
                          workspace.generation,
                        )).then(() => setManualPlaceId(null));
                      }}
                    >
                      <p className="v3-eyebrow">MANUAL LOCATION</p>
                      <h2>手工设置坐标</h2>
                      <p>{placeDisplayName(places.get(manualPlaceId))}</p>
                      <label>纬度<input value={latitude} onChange={(event) => setLatitude(event.target.value)} placeholder="35.0116" /></label>
                      <label>经度<input value={longitude} onChange={(event) => setLongitude(event.target.value)} placeholder="135.7681" /></label>
                      <div className="v3-modal-actions">
                        <button type="button" onClick={() => setManualPlaceId(null)}>取消</button>
                        <button type="submit" disabled={busy !== null}>保存坐标</button>
                      </div>
                    </form>
                  </div>
                )}
              </main>
            );
          }
