name: UC residual cap patch

on:
  push:
    branches: [codex/user-control-correction]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply two static contract fixes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/z\.array(IdSchema)\.min(1)\.max(200)/z.array(IdSchema).min(1)/' apps/server/contracts-v2.ts
          python -c 'from pathlib import Path; p=Path("apps/server/ai-stage-contracts-v3.ts"); t=p.read_text(); s=t.index("export const AiActionRecordSchema = z.object({"); old="targetIds: z.array(z.string().trim().min(1).max(160)).max(200),"; i=t.index(old,s); p.write_text(t[:i]+old.replace(".max(200)","")+t[i+len(old):])'
          git fetch origin main
          git checkout origin/main -- .github/workflows/v3-remove-temporary-workflows.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/contracts-v2.ts apps/server/ai-stage-contracts-v3.ts .github/workflows/v3-remove-temporary-workflows.yml
          git diff --cached --check
          git commit -m 'UC: remove residual local scope caps'
          git push origin HEAD:codex/user-control-correction
