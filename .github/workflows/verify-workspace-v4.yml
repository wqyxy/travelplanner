name: Verify workspace v4 redesign

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/src/WorkspaceAssistantV2.tsx'
      - 'apps/web/src/workspace-v4.css'
      - 'apps/web/src/main.tsx'
      - '.github/workflows/verify-workspace-v4.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
